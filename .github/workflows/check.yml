name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Offline and repository checks
        run: sh tools/check.sh
      - name: Unsigned iPad simulator build
        run: >-
          xcodebuild -project app/Mitsu.xcodeproj -scheme Mitsu
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO build
