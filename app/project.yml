name: Mitsu
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    SUPPORTS_MACCATALYST: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Mitsu:
    type: application
    platform: iOS
    sources:
      - path: Mitsu
        excludes: ['Resources/ASSET-PROVENANCE.md']
      - path: ../tools/ReadPolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mitsu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        'PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]': com.example.mitsu.preview
        'PRODUCT_NAME[sdk=macosx*]': MitsuPreview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mitsu
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown'
        INFOPLIST_KEY_NSLocationalwaysUsageDescription: Optional location for the dashboard map.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Show your approximate position on the map when you choose to enable location.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to your selected KONNWEI adapter to read the Outlander dashboard information.
    info:
      path: Mitsu/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Spotify callback
            CFBundleURLSchemes: [com.example.mitsu]
        LSApplicationQueriesSchemes: [spotify]
  MitsuUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    dependencies:
      - target: Mitsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mitsu.unittests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Mitsu.app/Mitsu'
        'TEST_HOST[sdk=macosx*]': '$(BUILT_PRODUCTS_DIR)/MitsuPreview.app/Contents/MacOS/MitsuPreview'
        BUNDLE_LOADER: '$(TEST_HOST)'
  MitsuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Mitsu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mitsu.uitests
        'PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]': com.example.mitsu.preview.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mitsu
schemes:
  Mitsu:
    build:
      targets:
        Mitsu: all
    run:
      config: Debug
    test:
      targets: [MitsuUnitTests, MitsuUITests]
